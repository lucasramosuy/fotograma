name: Desplegar Fotograma

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fotograma-produccion
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Instalar, verificar y preparar fuentes
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm prepare
      - name: Desplegar Worker con secreto Unsplash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f66373a49d42210eded48739ed762afa
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$UNSPLASH_ACCESS_KEY"
          umask 077
          printf 'UNSPLASH_ACCESS_KEY=%s\n' "$UNSPLASH_ACCESS_KEY" > "$RUNNER_TEMP/fotograma-secrets.env"
          trap 'rm -f "$RUNNER_TEMP/fotograma-secrets.env"' EXIT
          pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/fotograma-secrets.env"
